name: Deploy EKIDEN ATLAS (privacy-friendly)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST daily; refresh original structured facts without publishing the repo name
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate sanitized fact-only archive
        env:
          SOURCE_RECORDS_URL: ${{ secrets.SOURCE_RECORDS_URL }}
        run: node scripts/build-archive.mjs
      - name: Test site and privacy
        run: node tests/check.mjs
      - name: Build clean static output
        run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
